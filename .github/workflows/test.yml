# Diktatūra — greiti testai kiekvienam push / PR (be Ąžuolo modelio: make test + make test-privacy).
# Veikia Ubuntu 22.04 (toks pat Python 3.10 + GTK kaip savininko kompiuteryje); UI — per broadway (be ekrano).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sistemos paketai (kaip make deps, be sudo klausimų)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg pulseaudio-utils libnotify-bin python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 libgtk-3-bin curl bzip2 make
      - uses: astral-sh/setup-uv@v3
      - name: .venv (be torch) + kalbėtojų modeliai + LT fixture'ai
        run: |
          make hooks setup models fixtures
      - name: make lint
        run: make lint
      - name: make test
        run: make test
      - name: make test-privacy
        run: make test-privacy
