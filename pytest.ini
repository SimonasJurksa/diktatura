# Diktatūra — testai (make test / test-full / test-e2e). Žr. docs/PLAN.md „QA testų planas".
[pytest]
testpaths = tests
pythonpath = .
addopts = -q -ra --strict-markers
markers =
    full: reikia tikrų modelių (Ąžuolas / Silero VAD / kalbėtojų ONNX) ir LT garso fixture'ų — make test-full
    e2e: virtualus garsas (PulseAudio null-sink) ir tikri daemon'ai — make test-e2e
    ui: GTK langai (broadway, be tavo ekrano) — sistemos gi per .venv
