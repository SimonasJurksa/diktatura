# Wispr konfigūracija. Keisk per `make` komandas (arba ranka).
# autorecord.sh ir transcribe-pending.sh perskaito šį failą KIEKVIENĄ kartą (gyvai).

AUTOTRANSCRIBE=1      # 1 = transkribuoti; 0 = TIK įrašyti (netranskribuoti)
MODE=immediate
MODEL=azuolas-ct2
THREADS=6

# VOX režimas (balso aktyvumo įrašymas be Slack; diktavimui)
VOX_GATE_DB=-35      # garsumo slenkstis dBFS (aukštesnis = reikia garsiau; -40 jautriau, -30 tyliau)
VOX_SILENCE_SEC=5   # diktavimui trumpa tyla; pokalbiams gali didinti
VOX_MIN_SEC=1.5      # trumpesnius nei tiek — atmeta (blyksniai)

# Archyvavimas / valymas po transkripcijos
DELETE_EMPTY=1       # 1 = tuščią tekstą (ir jo wav) iškart ištrinti
ARCHIVE_MP3=1        # 1 = po teksto wav -> mp3 (taupo vietą ~8-10x), 0 = palikti wav
ARCHIVE_KBPS=64      # mp3 bitų greitis (48-96; 16kHz kalbai 64 su kaupu užtenka)
